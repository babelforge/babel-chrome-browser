openapi: 3.1.0
info:
  title: Projects Manager API Contract
  version: 0.1.0
  summary: Public API contract for implemented Projects Manager endpoints.
  description: >
    This specification documents only currently implemented Projects Manager API
    and callback endpoints. It excludes browser UI routes and admin review pages.
servers:
  - url: http://127.0.0.1:8770
    description: Local development server.
security:
  - bearerAuth: []
paths:
  /api/auth/status:
    get:
      operationId: getAuthStatus
      summary: Inspect the authenticated service-account actor.
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated service-account status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/tasks/{id}/transition:
    post:
      operationId: transitionTask
      summary: Apply one task status transition.
      tags:
        - Tasks
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskTransitionInput'
      responses:
        '200':
          description: Task transition result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTransitionOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/approvals/{id}/decision:
    post:
      operationId: decideApproval
      summary: Approve or deny one approval request.
      tags:
        - Approvals
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionInput'
      responses:
        '200':
          description: Approval decision result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDecisionOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/metadata/export:
    post:
      operationId: exportMetadata
      summary: Export a scoped redacted metadata package.
      tags:
        - Metadata Transfer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataExportInput'
      responses:
        '200':
          description: Redacted metadata package.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataPackage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/metadata/import/dry-run:
    post:
      operationId: dryRunMetadataImport
      summary: Build a non-destructive scoped metadata import plan.
      tags:
        - Metadata Transfer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataImportInput'
      responses:
        '200':
          description: Redacted dry-run summary and items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataImportDryRunOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/metadata/import/apply:
    post:
      operationId: applyMetadataImport
      summary: Apply a scoped metadata package after authorization and approval checks.
      tags:
        - Metadata Transfer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataImportInput'
      responses:
        '200':
          description: Redacted import write result and dry-run summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataImportApplyOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /webhooks/callback/{providerKey}/{routeName}:
    post:
      operationId: receiveWebhookCallback
      summary: Receive one provider webhook callback.
      description: >
        Persists a redacted callback intake record and returns an accepted or
        refused status. This endpoint does not execute external provider work.
      tags:
        - Webhook Callback
      security: []
      parameters:
        - name: providerKey
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: routeName
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: x-webhook-signature
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCallbackInput'
      responses:
        '202':
          description: Callback accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCallbackResult'
        '400':
          description: Invalid JSON callback payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCallbackResult'
        '401':
          description: Callback signature refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCallbackResult'
        '404':
          description: Callback route is missing or disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCallbackResult'
        '422':
          description: Callback payload is complete JSON but not acceptable for the route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCallbackResult'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-selector-secret
      description: Service-account bearer token in selector.secret format.
    sessionCookie:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: Symfony browser session for API Platform actions that also allow interactive users.
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Invalid request shape or inconsistent scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated actor is not authorized for the requested action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Request is syntactically valid but cannot be applied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AuthStatusResponse:
      type: object
      additionalProperties: false
      required:
        - actorType
        - identifier
        - displayName
        - roles
      properties:
        actorType:
          type: string
          enum:
            - service_account
        identifier:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
    TaskTransitionInput:
      type: object
      additionalProperties: false
      required:
        - targetStatus
      properties:
        targetStatus:
          type: string
          enum:
            - proposed
            - accepted
            - in_progress
            - delegated
            - waiting
            - blocked
            - review
            - done
            - canceled
            - failed
        assumedActorType:
          $ref: '#/components/schemas/NullableActorType'
        assumedActorId:
          type:
            - string
            - 'null'
    TaskTransitionOutput:
      type: object
      additionalProperties: false
      required:
        - taskId
        - status
      properties:
        taskId:
          type: string
        status:
          type: string
    ApprovalDecisionInput:
      type: object
      additionalProperties: false
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - approve
            - deny
        reason:
          type:
            - string
            - 'null'
        assumedActorType:
          $ref: '#/components/schemas/NullableActorType'
        assumedActorId:
          type:
            - string
            - 'null'
    ApprovalDecisionOutput:
      type: object
      additionalProperties: false
      required:
        - approvalId
        - status
      properties:
        approvalId:
          type: string
        status:
          type: string
          enum:
            - pending
            - approved
            - denied
            - expired
            - canceled
    MetadataExportInput:
      allOf:
        - $ref: '#/components/schemas/MetadataScopeInput'
    MetadataImportInput:
      allOf:
        - $ref: '#/components/schemas/MetadataScopeInput'
        - type: object
          additionalProperties: false
          required:
            - package
          properties:
            package:
              $ref: '#/components/schemas/MetadataPackage'
    MetadataScopeInput:
      type: object
      additionalProperties: false
      properties:
        realCompanyId:
          type:
            - string
            - 'null'
        virtualCompanyId:
          type:
            - string
            - 'null'
        managedProjectId:
          type:
            - string
            - 'null'
    MetadataPackage:
      type: object
      additionalProperties: true
      required:
        - format
        - version
      properties:
        format:
          type: string
        version:
          type: integer
        exportedAt:
          type:
            - string
            - 'null'
        source:
          type: object
          additionalProperties: true
        realCompanies:
          type: array
          items:
            type: object
            additionalProperties: true
        virtualCompanies:
          type: array
          items:
            type: object
            additionalProperties: true
        managedProjects:
          type: array
          items:
            type: object
            additionalProperties: true
        agentProfileTemplates:
          type: array
          items:
            type: object
            additionalProperties: true
        agentProfileTemplatePermissions:
          type: array
          items:
            type: object
            additionalProperties: true
        agents:
          type: array
          items:
            type: object
            additionalProperties: true
        agentProfileTemplateLinks:
          type: array
          items:
            type: object
            additionalProperties: true
        scopedGrants:
          type: array
          items:
            type: object
            additionalProperties: true
        projectRoleAssignments:
          type: array
          items:
            type: object
            additionalProperties: true
    MetadataImportDryRunOutput:
      type: object
      additionalProperties: false
      required:
        - summary
        - items
      properties:
        summary:
          $ref: '#/components/schemas/MetadataSummary'
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    MetadataImportApplyOutput:
      type: object
      additionalProperties: false
      required:
        - result
        - dryRunSummary
      properties:
        result:
          type: object
          additionalProperties: false
          required:
            - created
            - updated
            - skipped
          properties:
            created:
              type: integer
            updated:
              type: integer
            skipped:
              type: integer
        dryRunSummary:
          $ref: '#/components/schemas/MetadataSummary'
    MetadataSummary:
      type: object
      additionalProperties: false
      required:
        - creates
        - updates
        - skips
        - conflicts
      properties:
        creates:
          type: integer
        updates:
          type: integer
        skips:
          type: integer
        conflicts:
          type: integer
    WebhookCallbackInput:
      type: object
      additionalProperties: true
      required:
        - eventType
        - correlationId
      properties:
        eventType:
          type: string
        correlationId:
          type: string
        callbackId:
          type:
            - string
            - 'null'
    WebhookCallbackResult:
      type: object
      additionalProperties: false
      required:
        - accepted
        - status
        - reasonCode
        - callbackRecordId
      properties:
        accepted:
          type: boolean
        status:
          type: string
          enum:
            - accepted
            - refused
        reasonCode:
          type: string
        callbackRecordId:
          type: string
    NullableActorType:
      type:
        - string
        - 'null'
      enum:
        - user
        - agent
        - team
        - service_account
        - null
    ErrorResponse:
      type: object
      additionalProperties: true
      description: Symfony or API Platform error response. Shape depends on the failing layer and requested format.
